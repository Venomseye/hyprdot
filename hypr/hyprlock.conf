# hyprlock.conf
# https://wiki.hypr.land/Hypr-Ecosystem/hyprlock
#
# Text in all widgets supports pango markup (<b>, <i>, ...).
# Clear the password buffer with ESC, Ctrl+U or Ctrl+Backspace.

$font = JetBrainsMono Nerd Font

general {
    hide_cursor = true
    grace = 0
    no_fade_in = false
}

# uncomment to enable fingerprint authentication
# auth {
#     fingerprint {
#         enabled = true
#         ready_message = Scan fingerprint to unlock
#         present_message = Scanning...
#         retry_delay = 250 # in milliseconds
#     }
# }

animations {
    enabled = true
    bezier = linear, 1, 1, 0, 0
    animation = fadeIn, 1, 5, linear
    animation = fadeOut, 1, 5, linear
    animation = inputFieldDots, 1, 2, linear
}

background {
    monitor =

    # `screenshot` grabs your desktop at lock time. It is a screencopy request,
    # so it needs a permission grant in hyprland.lua while
    # ecosystem:enforce_permissions is on - that grant was missing before and
    # would have given you a black lock screen. It is there now:
    #     hl.permission("/usr/(bin|local/bin)/hyprlock", "screencopy", "allow")
    # Permission changes need a full Hyprland restart, not a reload.
    path = screenshot

    # ALTERNATIVE: use the current wallpaper instead, which needs no screencopy
    # permission at all and matches your matugen colours. The wpaperd hook
    # maintains this symlink on every wallpaper change. Swap the two lines and
    # test once before relying on it - if your hyprlock build doesn't expand
    # `~` here, write the path out in full instead.
    # path = ~/.cache/current-wallpaper

    blur_passes = 3
}

input-field {
    monitor =
    size = 20%, 5%
    outline_thickness = 3
    inner_color = rgba(0, 0, 0, 0.0) # no fill

    outer_color = rgba(33ccffee) rgba(00ff99ee) 45deg
    check_color = rgba(00ff99ee) rgba(ff6633ee) 120deg
    fail_color = rgba(ff6633ee) rgba(ff0066ee) 40deg

    font_color = rgb(143, 143, 143)
    fade_on_empty = false
    rounding = 15

    font_family = $font
    placeholder_text = Input password...
    fail_text = $PAMFAIL

    # uncomment to use a letter instead of a dot to indicate the typed password
    # dots_text_format = *
    # dots_size = 0.4
    dots_spacing = 0.3

    # uncomment to use an input indicator that does not show the password length
    # hide_input = true

    position = 0, -20
    halign = center
    valign = center
}

# TIME
label {
    monitor =
    text = $TIME
    font_size = 90
    font_family = $font

    position = -30, 0
    halign = right
    valign = top
}

# DATE
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B %Y" # update every 60 seconds
    font_size = 25
    font_family = $font

    position = -30, -150
    halign = right
    valign = top
}

# KEYBOARD LAYOUT
# Only useful if you actually have more than one layout configured. Your
# hyprland.lua sets kb_layout = "us" with no second layout, so this widget
# will always read "en" and the onclick does nothing. Left here, commented,
# in case you add a layout later.
