# hyprlock configuration.
# Colours come from matugen via hyprlock-colors.conf, which defines:
#   $accent $onaccent $secondary $tertiary $danger
#   $base $raised $glass $frost $text $subtext $line $faint
source = ~/.config/hypr/hyprlock-colors.conf

$font = JetBrainsMono Nerd Font Propo

general {
    hide_cursor = true
}

# `path = screenshot` is a screencopy request; hypr/rules.lua grants hyprlock
# that permission. Without it this background renders black.
background {
    monitor =
    path = screenshot
    color = $base
    blur_passes = 3
    blur_size = 6
    noise = 0.0117
    contrast = 0.9
    brightness = 0.6
    vibrancy = 0.17
}

# Clock
label {
    monitor =
    text = $TIME
    color = $text
    font_size = 96
    font_family = $font
    position = 0, 160
    halign = center
    valign = center
}

# Date (refreshed once a minute)
label {
    monitor =
    text = cmd[update:60000] date +"%A, %d %B"
    color = $subtext
    font_size = 20
    font_family = $font
    position = 0, 80
    halign = center
    valign = center
}

# Who's locked
label {
    monitor =
    text = $USER
    color = $subtext
    font_size = 14
    font_family = $font
    position = 0, -20
    halign = center
    valign = center
}

# Password field
input-field {
    monitor =
    size = 320, 52
    rounding = 12
    outline_thickness = 2
    dots_size = 0.25
    dots_spacing = 0.2
    dots_center = true
    fade_on_empty = false
    hide_input = false

    outer_color = $accent
    inner_color = $frost
    font_color = $text
    check_color = $secondary
    fail_color = $danger
    capslock_color = $tertiary

    font_family = $font
    placeholder_text = <i>Password</i>
    fail_text = <i>$FAIL <b>($ATTEMPTS)</b></i>

    position = 0, -90
    halign = center
    valign = center
}
