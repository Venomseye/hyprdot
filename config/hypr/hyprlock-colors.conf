# BOOTSTRAP placeholder (fallback palette) - matugen overwrites this file on the first wallpaper change.
# hyprlock.conf needs:   source = ~/.config/hypr/hyprlock-colors.conf
#
# Variable names are deliberately NOT prefixes of one another ($text/$subtext,
# not $on_surface/$on_surface_variant), in case hyprlang's $variable
# substitution is prefix-based.

$accent    = rgb(8ed1ff)
$onaccent  = rgb(00344b)
$secondary = rgb(b4cad6)
$tertiary  = rgb(c9c2ea)
$danger    = rgb(ffb4ab)

$base      = rgb(0f1417)
$raised    = rgb(1b2023)
$glass     = rgba(0f1417cc)
$frost     = rgba(1b2023cc)

$text      = rgb(dee3e7)
$subtext   = rgb(c0c7cd)
$line      = rgb(8a9297)
$faint     = rgb(40484d)
