# hypridle configuration.
#   3 min  dim the screen
#   5 min  lock with hyprlock
# Started from hypr/autostart.lua.

general {
    # What `loginctl lock-session` (Super+L) runs. pidof stops a second
    # hyprlock from stacking on top of the first.
    lock_cmd = pidof hyprlock || hyprlock
    # Lock BEFORE suspend so the screen is already locked on wake.
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on
}

# 3 minutes: dim. -s saves the current brightness, -r restores it on activity.
listener {
    timeout = 180
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 minutes: lock.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

