# hypridle configuration.
#   3 min  dim the screen
#   5 min  lock with hyprlock
# Started from hypr/autostart.lua. Nothing here turns the screen off or suspends by itself: see the
# two OPTIONAL blocks at the end. Until you enable one, a locked machine keeps its screen on.
#
# NOTE: since Hyprland 0.55 (Lua config) `hyprctl dispatch` evaluates its argument as Lua, so the old
# `hyprctl dispatch dpms on` is a syntax error and silently does nothing. The Lua form is used below
# (it is the one Hyprland's own /usr/share/hypr/hypridle.conf uses).

general {
    # What `loginctl lock-session` (Super+L) runs. pidof stops a second
    # hyprlock from stacking on top of the first.
    lock_cmd = if command -v dot-lock >/dev/null 2>&1; then dot-lock; else pidof hyprlock || hyprlock; fi
    # Lock BEFORE suspend so the screen is already locked on wake. dot-sleep-log writes the battery
    # level to ~/.local/state/dot/sleep.log so `dot-sleep-log report` / `dot-doctor` can show what
    # a suspend costs (skipped quietly if it is not installed).
    before_sleep_cmd = command -v dot-sleep-log >/dev/null 2>&1 && dot-sleep-log before; loginctl lock-session
    after_sleep_cmd = hyprctl dispatch 'hl.dsp.dpms({action = "on"})'; command -v dot-sleep-log >/dev/null 2>&1 && dot-sleep-log after
}

# 3 minutes: dim. -s saves the current brightness, -r restores it on activity.
listener {
    timeout = 180
    on-timeout = brightnessctl -s set 10%
    on-resume = brightnessctl -r
}

# 5 minutes: lock.
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# ---------------------------------------------------------------------------------------------
# OPTIONAL 1 - turn the display off 30 s after locking (saves the panel's power while locked).
# Off by default: DPMS is the most troublesome part of Hyprland on some setups, notably with an
# external monitor (crashes or a screen that stays black on wake: hyprwm/Hyprland#12884, #12791).
# The `sleep 1` gives hyprlock time to start. Try it; remove it again if the screens misbehave.
# listener {
#     timeout = 330
#     on-timeout = sleep 1 && hyprctl dispatch 'hl.dsp.dpms({action = "off"})'
#     on-resume = hyprctl dispatch 'hl.dsp.dpms({action = "on"})' && brightnessctl -r
# }

# OPTIONAL 2 - suspend after 15 minutes idle (the lock above has already happened, and
# before_sleep_cmd locks again if needed). Browsers playing video inhibit idle, so this will not
# suspend in the middle of a film. It WILL suspend with a long download running.
# listener {
#     timeout = 900
#     on-timeout = systemctl suspend
# }
