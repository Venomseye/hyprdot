general {
    lock_cmd = pidof hyprlock || hyprlock
    before_sleep_cmd = loginctl lock-session
    after_sleep_cmd = hyprctl dispatch dpms on

    # Both default to false already, but spelling them out documents the
    # intent: when a video player or browser says "don't idle", we listen.
    # This is what stops the screen locking mid-film. Firefox, Chromium and
    # mpv all send these; some Electron apps don't, so if a particular app
    # still locks on you, that app is the problem, not hypridle.
    ignore_dbus_inhibit = false
    ignore_systemd_inhibit = false
}

# The ladder below is 5 min -> lock, 5.5 min -> screen off, 10 min -> suspend.
# Keep them in this order and keep the gaps; a dpms-off timeout shorter than
# the lock timeout means the screen blanks before the lock screen paints.

# Lock after 5 minutes of inactivity
listener {
    timeout = 300
    on-timeout = loginctl lock-session
}

# Turn the screen off 30 seconds after locking, so you're not burning
# backlight on a locked screen
listener {
    timeout = 330
    on-timeout = hyprctl dispatch dpms off
    on-resume = hyprctl dispatch dpms on
}

# Suspend after 10 minutes total of inactivity
listener {
    timeout = 600
    on-timeout = systemctl suspend
}
