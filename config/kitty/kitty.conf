# kitty - part of hyprdot. Colours come from matugen (colors-matugen.conf, included
# on the LAST line so nothing above can override it; kitty reloads on wallpaper change).

font_family       JetBrainsMono Nerd Font
bold_font         auto
italic_font       auto
bold_italic_font  auto
font_size         11.5

cursor_shape            beam
cursor_blink_interval   0
scrollback_lines        10000
copy_on_select          clipboard
strip_trailing_spaces   smart
mouse_hide_wait         3
enable_audio_bell       no
visual_bell_duration    0
update_check_interval   0
shell_integration       enabled

# Hyprland draws the border and rounding; kitty adds air and see-through (blurred
# by Hyprland's decoration blur).
hide_window_decorations yes
remember_window_size    no
window_padding_width    10
background_opacity      0.88
dynamic_background_opacity yes

# Closing a window or tab never asks "are you sure?" (Super+Q, the X, ctrl+shift+w),
# even with a program still running inside it.
confirm_os_window_close 0

tab_bar_edge            top
tab_bar_style           powerline
tab_powerline_style     round
tab_title_template      "{index}: {title}"

# nmtui / whiptail ("newt") draw with fixed ANSI colour names; with the matugen palette their
# defaults are pink-on-pink. Same value as hypr/autostart.lua.
env NEWT_COLORS=root=white,black roottext=lightgray,black window=white,black border=lightgray,black shadow=black,black title=blue,black button=blue,black actbutton=black,blue compactbutton=white,black checkbox=white,black actcheckbox=black,blue entry=black,lightgray disentry=gray,black label=white,black listbox=white,black actlistbox=white,black sellistbox=blue,black actsellistbox=black,blue textbox=white,black acttextbox=black,blue helpline=black,lightgray emptyscale=gray,black fullscale=blue,black

env NMT_NEWT_COLORS=plainLabel=white,black badLabel=red,black disabledButton=gray,black textboxWithBackground=black,lightgray

include colors-matugen.conf
