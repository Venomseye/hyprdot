[config]
# Pins matugen 4.x's interactive "select source colour" prompt so it runs
# non-interactively from wpaperd's hook. 0 = most dominant colour.
source_color_index = 0

# No [config.wallpaper] table on purpose: matugen requires `command` in it
# unconditionally once it exists, and wpaperd owns the wallpaper anyway.

# ---------------------------------------------------------------------------
# Templates -> outputs. Each output has a bootstrap seed of the same name in
# this repo (config/<same path>) that install.sh copies once; after that only
# matugen writes it.
#
# No post_hooks here. Reloading Quickshell / Kitty / Ghostty / GTK / Hyprland is
# done by ~/.config/hooks/.d/theme-set.d/01-reload.sh, which
# wpaperd/matugen-hook.sh runs once matugen has finished writing EVERY file
# below. A post_hook here as well would fire each reload twice.
# ---------------------------------------------------------------------------

# 1. Quickshell - a QML singleton. Quickshell reloads itself when a file in its
#    config dir changes, so writing this file IS the reload signal.
[templates.quickshell]
input_path = '~/.config/matugen/templates/Colors.qml'
output_path = '~/.config/quickshell/theme/Colors.qml'

# 2. Hyprland - Lua table loaded by hypr/looknfeel.lua.
[templates.hyprland]
input_path = '~/.config/matugen/templates/hyprland-colors.template'
output_path = '~/.config/hypr/colors-matugen.lua'

# 3. hyprlock - `source`d by hypr/hyprlock.conf. Read fresh on every lock.
[templates.hyprlock]
input_path = '~/.config/matugen/templates/hyprlock-colors.template'
output_path = '~/.config/hypr/hyprlock-colors.conf'

# 4. Kitty - included from kitty.conf.
[templates.kitty]
input_path = '~/.config/matugen/templates/kitty-colors.template'
output_path = '~/.config/kitty/colors-matugen.conf'

# 5. Ghostty - included from ghostty/config via `config-file`.
[templates.ghostty]
input_path = '~/.config/matugen/templates/ghostty-colors.template'
output_path = '~/.config/ghostty/colors-matugen'

# 6 + 7. GTK 3 and 4 - one template, two destinations. Needs adw-gtk-theme and
#        `@import url("colors.css");` in each gtk.css. GTK4/libadwaita apps only
#        read it at startup, so already-open ones need a restart.
[templates.gtk3]
input_path = '~/.config/matugen/templates/gtk-colors.template'
output_path = '~/.config/gtk-3.0/colors.css'

[templates.gtk4]
input_path = '~/.config/matugen/templates/gtk-colors.template'
output_path = '~/.config/gtk-4.0/colors.css'

# Extra (no seed needed): btop. Needs `color_theme = "matugen"` in btop.conf and
# is read at launch. matugen-hook.sh creates the themes/ directory.
[templates.btop]
input_path = '~/.config/matugen/templates/btop-colors.template'
output_path = '~/.config/btop/themes/matugen.theme'
