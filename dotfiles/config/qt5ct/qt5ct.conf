[Appearance]
color_scheme_path=__HOME__/.config/qt5ct/colors/matugen.conf
custom_palette=true
style=Fusion

# color_scheme_path needs a literal, fully-resolved absolute path - qt5ct
# does not expand $HOME or ~ here (confirmed against a real, working example
# from another user's qt5ct.conf: they had to write out their actual home
# directory by hand, e.g. /home/pippo/.config/..., not a variable).
# __HOME__ above gets replaced with your real home directory by install.sh
# at install time, so this works out of the box without you editing it by
# hand. If you ever see the literal text "__HOME__" in this file after
# installing, install.sh's substitution step didn't run - just replace it
# with your home directory path yourself.
#
# icon_theme is deliberately left unset. Setting it to a theme name you
# don't actually have installed (e.g. "breeze" without the breeze-icons
# package) can leave Qt apps with MISSING icons throughout their UI, which is
# worse than just letting qt5ct fall back to whatever it auto-detects on
# first run. If you do have breeze-icons installed and want that icon set,
# add:
#   icon_theme=breeze
#
# [Fonts] is deliberately omitted too - qt5ct stores font choices as a
# binary-encoded QVariant (Qt's own internal serialization format), and
# hand-writing that byte-for-byte without a real Qt environment to generate
# it from isn't something I can verify is correct. Getting it wrong risks
# qt5ct failing to parse its own config, which is a worse outcome than Qt
# apps just using their normal default font resolution. Set your font once
# through the qt5ct GUI itself (run `qt5ct`) if you want to customise it -
# it'll write this section correctly on save.
