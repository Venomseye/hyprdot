# Configuration
font_family                 JetBrainsMono Nerd Font
font_size                   12
bold_font                   auto
italic_font                 auto
bold_italic_font            auto
remember_window_size        no
initial_window_width        950
initial_window_height       500
cursor_blink_interval       0.5
cursor_stop_blinking_after  1
scrollback_lines            2000
wheel_scroll_min_lines      1
enable_audio_bell           no
window_padding_width        10
hide_window_decorations     yes
background_opacity          0.7
dynamic_background_opacity  yes
confirm_os_window_close     0
selection_foreground        none
selection_background        none

# Animated cursor follows text
# include ../ml4w/settings/kitty-cursor-trail.conf

# Wallpaper colours from matugen.
#
# kitty does NOT auto-reload its config - there is no auto_reload_config
# option, contrary to what the old matugen config.toml comment claimed. A
# running kitty keeps its old palette until it gets SIGUSR1 (or you press
# ctrl+shift+f5). matugen's kitty post_hook sends that signal now.
include colors-matugen.conf

# Your own overrides. globinclude rather than include: a plain `include` of a
# file that doesn't exist makes kitty log an error on every launch, whereas
# globinclude quietly matches nothing.
globinclude custom.conf
